name: abm_mobile
description: >
  ABM 2.0 — Phase v1.0 Flutter Mobile Node.
  Persistent Android Foreground Service (via flutter_foreground_task) that
  feeds ambient telemetry into the desktop memory core through a local API
  channel. BLoC state management per ABM Architectural Constitution rule 6.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Foreground Service ────────────────────────────────────────────────────
  # Maintained plugin for Android Foreground Service — device-agnostic,
  # persistent notification, prevents OS low-memory killer from terminating
  # the execution thread. PROJECT_BRIEF.md ground rule 6 compliance.
  flutter_foreground_task: ^9.2.2

  # ── State Management ──────────────────────────────────────────────────────
  # BLoC pattern per PROJECT_BRIEF.md ground rule 6 and Stream A schema
  # (framework: "flutter", state_pattern: "bloc").
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Networking (local API calls to desktop daemon) ────────────────────────
  http: ^1.2.1

  # ── Secure Storage (for future crypto key storage) ────────────────────────
  # flutter_secure_storage wraps Android Keystore / iOS Keychain.
  # Architectural Constitution rule 7 — no hand-rolled cryptography.
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0

  # ── Settings (non-secret runtime config) ─────────────────────────────────
  # Persists the desktop sync base URL so the user can change it from the
  # settings screen without a rebuild. Not for secrets — use
  # flutter_secure_storage for those.
  shared_preferences: ^2.3.2

  # ── Utilities ─────────────────────────────────────────────────────────────
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
